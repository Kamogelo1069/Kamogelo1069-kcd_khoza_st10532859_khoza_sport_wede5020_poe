<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Enquiry - Khoza Sport</title>
    <meta name="description" content="Inquire about sports equipment prices, availability, volunteer, or sponsorship opportunities with Khoza Sport.">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <div>
            <img src="images/KS.png" alt="Khoza Sport Logo" width="80">
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                    <a href="about_us.html">About Us</a>
                    <a href="product.html">Our Products</a>
                    <a href="contact.html">Contact Us</a>
                    <a href="enquiry.html">Enquiry</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="products-section">
        <h2>Submit an Enquiry</h2>
        <form id="enquiry-form" style="max-width: 600px; margin: 0 auto;">
            <div style="margin-bottom: 1rem;">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required style="width:100%; padding: 8px; margin-top:5px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required style="width:100%; padding: 8px; margin-top:5px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="0729812985" style="width:100%; padding: 8px; margin-top:5px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="enquiry-type">Enquiry Category:</label>
                <select id="enquiry-type" name="enquiry-type" style="width:100%; padding: 8px; margin-top:5px;">
                    <option value="pricing">Product Pricing & Stock</option>
                    <option value="sponsor">Sponsorship Opportunity</option>
                    <option value="volunteer">Volunteer Program</option>
                </select>
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="details">Enquiry Details:</label>
                <textarea id="details" name="details" rows="5" required style="width:100%; padding: 8px; margin-top:5px;"></textarea>
            </div>

            <button type="submit" class="btn">Submit Enquiry</button>
            <div id="form-response"></div>
        </form>
    </main>

    <footer>
        <p>Contact email: khozakamogelo95@gmail.com</p>
        <p>Tel: 0729812985</p>
        <p>Student ID: st10532859</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
